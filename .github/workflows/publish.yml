name: Publish Quarto website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate content and provenance
        run: |
          python scripts/build_content_index.py
          python scripts/validate_site.py
      - name: Render website
        run: quarto render
      - name: Confirm source PDFs are not deployed
        run: |
          if find _site -type f -iname '*.pdf' | grep -q .; then
            echo 'Unexpected PDF found in rendered site' >&2
            exit 1
          fi
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
